name: Review municipal source changes
on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: municipal-source-review
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh-sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: municipal-source-candidates
          path: staging/*.json
          retention-days: 14
