name: Validate public snapshot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - run: python -m pip install playwright
      - run: python tests/browser.py
      - run: python tests/media-browser.py
      - run: python tests/shared-food-browser.py
      - run: python tests/sw-update.py
      - uses: actions/upload-artifact@v4
        with:
          name: minamigo-test-preview
          path: dist/
          retention-days: 7
